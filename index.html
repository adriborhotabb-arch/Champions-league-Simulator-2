<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Champions League</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1a1d29;--mu:#6b7280;--ac:#1d4ed8;--hi:#fef3c7;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--tx:#e8eaf3;--mu:#9aa3b8;--ac:#60a5fa;--hi:#4a3b0a;--bd:#2c3250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--tx:#e8eaf3;--mu:#9aa3b8;--ac:#60a5fa;--hi:#4a3b0a;--bd:#2c3250;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.3em 0}h2{font-size:1.1rem;margin:1.2em 0 .4em;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
button,select,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 4px 4px 0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.mine{background:var(--hi);border-radius:6px;padding:0 6px;font-weight:600}
.mu{color:var(--mu)}.win{font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px}
.champ{font-size:1.3rem;font-weight:800;text-align:center;padding:16px}
</style></head><body><main>
<h1>⚽ Simulador de la Champions</h1>
<div id="setup" class="card">
  <p>Elige tu equipo:</p>
  <select id="sel"></select>
  <div id="custom" hidden><input id="cn" placeholder="Nombre del equipo"><input id="cp" placeholder="País (3 letras, ej: ESP)" maxlength="3" size="12"></div>
  <div><button id="go">Empezar torneo</button></div>
</div>
<div id="log"></div>
<div id="ctl" hidden style="position:sticky;bottom:8px"><button id="next" style="width:100%;padding:14px"></button></div>
<div id="end" hidden class="card"><button id="again">Reiniciar con el mismo equipo</button><button id="other" class="sec">Cambiar de equipo</button></div>
</main>
<script>
const BOMBOS_ORIGINAL={
1:[["Real Madrid","ESP"],["Man. City","ENG"],["Bayern","GER"],["PSG","FRA"],["Inter","ITA"],["Barcelona","ESP"],["Arsenal","ENG"],["Dortmund","GER"]],
2:[["Atletico","ESP"],["Liverpool","ENG"],["Leverkusen","GER"],["Juventus","ITA"],["Milan","ITA"],["Benfica","POR"],["Napoli","ITA"],["Monaco","FRA"]],
3:[["Sevilla","ESP"],["Chelsea","ENG"],["Leipzig","GER"],["Oporto","POR"],["Ajax","NED"],["Lille","FRA"],["Roma","ITA"],["Sporting","POR"]],
4:[["Celtic","SCO"],["PSV","NED"],["Galatasaray","TUR"],["Brujas","BEL"],["Shakhtar","UKR"],["Salzburgo","AUT"],["Young Boys","SUI"],["Estrella Roja","SRB"]]};
const RATINGS={"Real Madrid":2050,"Man. City":2050,"Bayern":2000,"PSG":1950,"Inter":1950,"Barcelona":1950,"Arsenal":1980,"Dortmund":1850,"Atletico":1880,"Liverpool":1960,"Leverkusen":1880,"Juventus":1830,"Milan":1800,"Benfica":1800,"Napoli":1800,"Monaco":1740,"Sevilla":1720,"Chelsea":1850,"Leipzig":1800,"Oporto":1760,"Ajax":1720,"Lille":1730,"Roma":1760,"Sporting":1780,"Celtic":1650,"PSV":1730,"Galatasaray":1680,"Brujas":1670,"Shakhtar":1640,"Salzburgo":1650,"Young Boys":1600,"Estrella Roja":1600};
const RATING_DEFECTO=1650,GOLES_BASE=1.35,ESCALA=800,VENTAJA_LOCAL=60,VARIACION_FORMA=35,NUM_GRUPOS=8;
let bombos={},fuerza={},mio=null,gen=null,pm=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=e=>e===mio?`<span class="mine">${esc(e)}</span>`:esc(e);
const out=h=>{const d=document.createElement("div");d.innerHTML=h;$("log").appendChild(d);d.scrollIntoView({block:"nearest",behavior:"smooth"});return d};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gauss=(m,s)=>m+s*Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());

// ---- modelo de partidos ----
function calcularFuerza(){const f={};for(const n in bombos)for(const[e]of bombos[n])f[e]=(RATINGS[e]??RATING_DEFECTO)+gauss(0,VARIACION_FORMA);return f}
function poisson(l){const lim=Math.exp(-l);let k=0,p=1;while(true){p*=Math.random();if(p<=lim)return k;k++}}
function jugar(a,b,neutral=false,factor=1){const d=fuerza[a]-fuerza[b]+(neutral?0:VENTAJA_LOCAL);
 return[poisson(GOLES_BASE*Math.exp(d/ESCALA)*factor),poisson(GOLES_BASE*Math.exp(-d/ESCALA)*factor)]}
function penaltis(a,b){const p=Math.max(.4,Math.min(.6,.5+(fuerza[a]-fuerza[b])/4000));return Math.random()<p?a:b}

// ---- sorteo ----
function grupoValido(g,pais,nb){return g.length<nb&&!g.some(x=>x[1]===pais)}
function sortear(){while(true){const grupos=Array.from({length:NUM_GRUPOS},()=>[]);let ok=true;
 for(let nb=1;nb<=4&&ok;nb++){for(const[e,p]of shuffle(bombos[nb].slice())){const pos=grupos.filter(g=>grupoValido(g,p,nb));
  if(!pos.length){ok=false;break}pos[Math.floor(Math.random()*pos.length)].push([e,p])}}
 if(ok)return grupos}}

// ---- fase de grupos ----
function faseDeGrupos(grupos){const pri=[],seg=[];let html='<h2>Fase de grupos</h2><div class="groups">';let extra="";
 grupos.forEach((grupo,i)=>{const nom=grupo.map(x=>x[0]),t={};nom.forEach(e=>t[e]=[0,0,0]);let mios="";
  for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)for(const[l,v]of[[nom[a],nom[b]],[nom[b],nom[a]]]){
   const[ga,gb]=jugar(l,v);t[l][1]+=ga;t[l][2]+=gb;t[v][1]+=gb;t[v][2]+=ga;
   if(ga>gb)t[l][0]+=3;else if(gb>ga)t[v][0]+=3;else{t[l][0]++;t[v][0]++}
   if(mio===l||mio===v)mios+=`<div>» ${nm(l)} ${ga}-${gb} ${nm(v)}</div>`}
  const orden=nom.map(e=>({e,r:Math.random()})).sort((x,y)=>t[y.e][0]-t[x.e][0]||(t[y.e][1]-t[y.e][2])-(t[x.e][1]-t[x.e][2])||t[y.e][1]-t[x.e][1]||y.r-x.r).map(o=>o.e);
  html+=`<div class="card"><b>Grupo ${String.fromCharCode(65+i)}</b>`+orden.map((e,p)=>`<div class="row"><span>${p+1}. ${nm(e)}</span><span class="mu">${t[e][0]} pts (${t[e][1]}-${t[e][2]})</span></div>`).join("")+
   (mios?`<hr style="border:0;border-top:1px solid var(--bd)"><div class="mu">${mios}</div>`:"")+
   (nom.includes(mio)&&!orden.slice(0,2).includes(mio)?`<div class="mu">Tu equipo queda eliminado en la fase de grupos.</div>`:"")+`</div>`;
  pri.push([orden[0],i]);seg.push([orden[1],i])});
 out(html+"</div>");return[pri,seg]}

// ---- eliminatoria ----
function emparejar(pri,seg){while(true){shuffle(seg);if(pri.every((p,k)=>p[1]!==seg[k][1]))break}return pri.map((p,k)=>[p[0],seg[k][0]])}
const fl=(t,w)=>w?`<span class="win">${t}</span>`:t;
function finalUnica(a,b){let[ga,gb]=jugar(a,b,true),h=`<div>${nm(a)} ${ga}-${gb} ${nm(b)}</div>`;
 if(ga!==gb)return[ga>gb?a:b,h];
 const[ea,eb]=jugar(a,b,true,1/3);ga+=ea;gb+=eb;h+=`<div class="mu">Prórroga: ${esc(a)} ${ga}-${gb} ${esc(b)}</div>`;
 if(ga!==gb)return[ga>gb?a:b,h];
 const g=penaltis(a,b);return[g,h+`<div class="mu">Gana en los penaltis: ${nm(g)}</div>`]}
function dobleP(a,b){const[gb1,ga1]=jugar(b,a),[ga2,gb2]=jugar(a,b);let ta=ga1+ga2,tb=gb1+gb2;
 let h=`<div>Ida: ${nm(b)} ${gb1}-${ga1} ${nm(a)}</div><div>Vuelta: ${nm(a)} ${ga2}-${gb2} ${nm(b)}</div>`;
 if(ta!==tb){const g=ta>tb?a:b;return[g,h+`<div class="mu">Global ${ta}-${tb} → pasa ${nm(g)}</div>`]}
 const[ea,eb]=jugar(a,b,false,1/3);ta+=ea;tb+=eb;h+=`<div class="mu">Prórroga: ${ea}-${eb}</div>`;
 if(ta!==tb){const g=ta>tb?a:b;return[g,h+`<div class="mu">Global ${ta}-${tb} → pasa ${nm(g)}</div>`]}
 const g=penaltis(a,b);return[g,h+`<div class="mu">Global empatado ${ta}-${tb}. Pasa ${nm(g)} en los penaltis</div>`]}
function* eliminatoria(partidos,vivo){const N={8:"Octavos",4:"Cuartos",2:"Semifinales",1:"Final"};
 while(true){const fase=N[partidos.length],fin=partidos.length===1;
  out(`<h2>${fase}</h2><div class="card">`+partidos.map(([a,b])=>`<div>${nm(a)} vs ${nm(b)}</div>`).join("")+"</div>");
  yield fin?"Jugar la final":"Jugar "+fase.toLowerCase();
  const gan=[];let h="";
  for(const[a,b]of partidos){const[g,t]=fin?finalUnica(a,b):dobleP(a,b);gan.push(g);h+=`<div class="card">${t}</div>`}
  if(vivo&&!gan.includes(mio)){vivo=false;h+=`<p>Tu equipo (${esc(mio)}) queda eliminado.</p>`}
  else if(vivo&&gan.length>1)h+=`<p>${nm(mio)} pasa de ronda!</p>`;
  out(h);
  if(fin)return gan[0];
  yield "Continuar";
  partidos=gan.filter((_,k)=>k%2===0).map((g,k)=>[g,gan[2*k+1]])}}

// ---- torneo ----
function* torneo(){fuerza=calcularFuerza();
 yield "Hacer el sorteo";
 const grupos=sortear();
 out('<h2>Sorteo de grupos</h2><div class="groups">'+grupos.map((g,i)=>`<div class="card"><b>Grupo ${String.fromCharCode(65+i)}</b>`+g.map(([e,p])=>`<div>${nm(e)} <span class="mu">(${esc(p)})</span></div>`).join("")+"</div>").join("")+"</div>");
 yield "Jugar la fase de grupos";
 const[pri,seg]=faseDeGrupos(grupos);
 const vivo=[...pri,...seg].some(x=>x[0]===mio);
 if(vivo)out(`<p>${nm(mio)} pasa a octavos!</p>`);
 yield "Ver los cruces de octavos";
 const campeon=yield*eliminatoria(emparejar(pri,seg),vivo);
 out(`<div class="card champ">🏆 CAMPEÓN DE LA CHAMPIONS: ${esc(campeon).toUpperCase()}<br>${campeon===mio?"¡ENHORABUENA, TU EQUIPO HA GANADO LA CHAMPIONS!":`<span class="mu" style="font-size:1rem;font-weight:400">Tu equipo (${esc(mio)}) no ha ganado esta vez.</span>`}</div>`)}

// ---- control ----
function avanzar(){const r=gen.next();if(r.done){$("ctl").hidden=true;$("end").hidden=false;$("end").scrollIntoView({block:"nearest",behavior:"smooth"})}else $("next").textContent=r.value}
function empezar(nombre,pais){bombos=JSON.parse(JSON.stringify(BOMBOS_ORIGINAL));
 const ya=Object.values(bombos).flat().find(x=>x[0].toLowerCase()===nombre.toLowerCase());
 if(ya)mio=ya[0];
 else{mio=nombre;pm=pais;const i=Math.floor(Math.random()*8),sale=bombos[4][i];bombos[4][i]=[nombre,pais];
  out(`<p>${esc(nombre)} entra en el bombo 4 (sustituye a ${esc(sale[0])})</p>`)}
 $("setup").hidden=true;$("end").hidden=true;$("ctl").hidden=false;gen=torneo();avanzar()}
const sel=$("sel");
Object.values(BOMBOS_ORIGINAL).flat().forEach(([e])=>sel.add(new Option(e,e)));
sel.add(new Option("Otro equipo…","__otro"));
sel.onchange=()=>$("custom").hidden=sel.value!=="__otro";
$("go").onclick=()=>{$("log").innerHTML="";
 if(sel.value==="__otro"){const n=$("cn").value.trim(),p=$("cp").value.trim().toUpperCase();
  if(!n||p.length!==3){alert("Escribe el nombre y un país de 3 letras (ej: ESP)");return}empezar(n,p)}
 else empezar(sel.value)};
$("next").onclick=avanzar;
$("again").onclick=()=>{$("log").innerHTML="";const x=Object.values(BOMBOS_ORIGINAL).flat().find(x=>x[0]===mio);
 empezar(mio,x?x[1]:pm)};
$("other").onclick=()=>{$("log").innerHTML="";$("end").hidden=true;$("setup").hidden=false};
</script></body></html>
